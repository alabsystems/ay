# Author: Andrew Yates <andrewyates.name@gmail.com>
# OPB/WBO pseudo-Boolean format parser for PB26 competition

[package]
name = "ay-pb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OPB/WBO pseudo-Boolean format parser for PB competition instances"
readme.workspace = true
repository.workspace = true
autobins = false

[lints]
workspace = true

[features]
default = []
# Large checked-in proof sidecars and external-checker certification gates.
# Tests enabled by this feature require VeriPB through VERIPB_BIN or PATH and
# fail closed when the checker is absent or rejects a generated proof.
# Keep this opt-in so ordinary library consumers need no external checker.
certified-proof-artifacts = ["ay-pb-core/certified-proof-artifacts", "dep:nix"]
# Explicit, non-default developer campaigns and fixture generators. Keeping
# these behind a feature lets the tools call crate-internal solver lanes without
# widening the production library API.
dev-tools = ["ay-pb-core/dev-tools", "dep:nix"]

[dependencies]
ay-pb-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ay-core.workspace = true
ay-sat.workspace = true
ay-sys.workspace = true
signal-hook.workspace = true
rustc-hash.workspace = true
ay-jit = { workspace = true, optional = true }
num-rational.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
# Leaf-owned native MILP lane (OPT-LIN post-solve optimality upgrade). The
# solver implementation is in ay-pb-core, so ay-milp can depend on that core
# without closing a package cycle through this facade.
ay-milp.workspace = true

# Process-CPU accounting (getrusage) for the competition CPU-time budget
# (AY_PB_CPU_BUDGET_MS): PB-COMP's TIMELIMIT is total CPU time across threads,
# not wall time, so the solver must be able to stand down on its own CPU clock.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, optional = true }

[[bin]]
name = "ay-pb"
path = "src/bin/ay.rs"

[[bin]]
name = "ay-pb-dev"
path = "src/bin/dev.rs"
required-features = ["dev-tools"]

[dev-dependencies]
ay-test-support.workspace = true
# Compile-fail lock for the primal worker-return split (tests/trybuild.rs):
# a primal optimization worker must be STRUCTURALLY unable to produce a
# Done/OptimumFound verdict.
trybuild.workspace = true
num-rational.workspace = true
