# ay-milp: MILP/LP engine and the typed in-process API consumed by ny.
#
# Designed in the development design notes and
# the development design notes At L0 (feature `smt`, default ON)
# the engine is a shim over ay-dpll's typed Solver; Track E replaces the
# internals with a native revised dual simplex + branch-and-cut underneath the
# same API, at which point the `smt` default flips off.
[package]
name = "ay-milp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MILP/LP optimization engine with certified verdicts (Farkas / optimality certificates)"

[features]
default = ["smt"]
# The L0 lowering lane through ay-dpll's typed Solver API. Carries the full
# ay-dpll dependency; native Track E paths do not need it.
smt = ["dep:ay-dpll"]
# ALLOCATION CENSUS. Compiles the per-region / per-segment allocation probes into the
# branch-and-bound node loop. OFF by default and the probes are `#[cfg]`-erased, not merely
# branch-predicted, so a default build has bit-identical codegen in the hot loop. Only the
# `alloc_census` measurement binary asks for it.
acensus = []

[dependencies]
ay-dpll = { workspace = true, optional = true }
ay-pb-core.workspace = true
ay-sat.workspace = true
ay-lra.workspace = true
ay-sys.workspace = true
num-rational.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
num-integer.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[dev-dependencies]
ay-test-support.workspace = true
proptest.workspace = true

[lints]
workspace = true

# The census binary is the only consumer of the `acensus` probes; `required-features` keeps a
# plain `cargo build --examples` from silently producing a binary whose probes are erased.
[[example]]
name = "alloc_census"
required-features = ["acensus"]
