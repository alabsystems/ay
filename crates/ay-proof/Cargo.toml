[package]
name = "ay-proof"
description = "Proof production and export for AY"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
ay-core.workspace = true
ay-sat.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
proptest.workspace = true
ay-lrat-check.workspace = true
# Differential-fuzz ORACLES ONLY (tests/string_ground_diff_fuzz.rs). The
# checker's ground string/regex evaluator must stay independent of the solver,
# so this is a dev-dependency and must never become a real dependency.
ay-strings.workspace = true
# NAME-AUTHORITY LINT ONLY (checker/name_authority_tests.rs). The lint asserts
# that every operator spelling a strict validator matches on is a spelling
# `ay-frontend` guarantees denotes the native theory operator. The checker must
# stay independent of the frontend, so this is a dev-dependency and must never
# become a real dependency.
ay-frontend.workspace = true

[lints]
workspace = true
