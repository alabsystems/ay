# Author: Andrew Yates <andrewyates.name@gmail.com>
# Core OPB/WBO solver with no dependency on an embedding MILP engine.

[package]
name = "ay-pb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core pseudo-Boolean parser and solver for AY"
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
certified-proof-artifacts = ["dep:nix"]
dev-tools = ["dep:nix"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ay-core.workspace = true
ay-sat.workspace = true
ay-sys.workspace = true
signal-hook.workspace = true
rustc-hash.workspace = true
ay-jit = { workspace = true, optional = true }
num-rational.workspace = true
num-bigint.workspace = true
num-traits.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, optional = true }

[dev-dependencies]
ay-test-support.workspace = true
num-rational.workspace = true
