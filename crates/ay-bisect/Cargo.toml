[package]
name = "ay-bisect"
description = "Feature-flag bisection harness for AY soundness debugging"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true

[lib]
name = "ay_bisect"
path = "src/lib.rs"

[[bin]]
name = "ay-bisect"
path = "src/main.rs"

[dependencies]
# Non-optional on purpose: this crate ships a bin target, and every bin must
# be able to arm the kernel memory bound (see crates/ay-sys/src/govern.rs).
ay-sys.workspace = true
anyhow.workspace = true
clap.workspace = true
rayon.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Files outside `src/` that this crate's shipped code embeds (`include_str!`):
# inputs of every build-provenance stamp built from it (build_support/provenance_scope.rs).
[package.metadata.ay-provenance]
inputs = ["../../scripts/_oom_guard.py"]

[lints]
workspace = true
