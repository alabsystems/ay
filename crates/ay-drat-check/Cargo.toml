[package]
name = "ay-drat-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ay-drat-check"
description = "DRAT/DRUP proof-checking library for SAT solver certificates"
readme.workspace = true

[lib]
name = "ay_drat_check"
path = "src/lib.rs"

[dependencies]
# Non-optional on purpose: this crate ships a bin target, and every bin must
# be able to arm the kernel memory bound (see crates/ay-sys/src/govern.rs).
ay-sys.workspace = true
thiserror.workspace = true
ay-proof-common.workspace = true
rustc-hash.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
