[package]
name = "ay-sat"
description = "CDCL SAT solver core for AY"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = ["raw-pointer-bcp", "jit"]
serde = ["dep:serde"]
# Raw-pointer implementation of the same watched-literal traversal.
raw-pointer-bcp = []
# Experimental: enable non-BCP SAT JIT support and shared ay-jit helpers.
# SAT BCP/watch JIT was removed from the production path in #8517.
jit = ["dep:ay-jit"]
# CLI integration: derives clap::ValueEnum on SatTechnique for --disable flag
cli = ["dep:clap"]
# Exactness pin for the incremental relevancy frontier
# (#relevancy-frontier-incremental): cross-check the incrementally maintained
# CNF frontier against the original from-scratch clause walk on EVERY engaged
# decision and assert set equality. The check costs exactly what the
# incremental frontier saves (O(clauses x literals) per decision), so it is not
# on by default; a plain `debug_assertions` build already checks a bounded
# prefix of each solver's engaged decisions (see
# `solver/relevancy_frontier.rs::DEFAULT_DEBUG_CHECKS`). Turn this on to run
# the suites with the full invariant.
relevancy-frontier-invariants = []
# Lean4 integration tests (#8697): kernel-verify emitted proofs end-to-end
# with the Lean pinned in the repository's `lean-toolchain`, run as
# `elan run <toolchain> lean` (ay_test_support::lean), never a `lean` on PATH.
# Requires elan with that toolchain installed.
lean-integration = []
# Route-b in-memory UNSAT certificate API (Program CK1 WS1-M1): solve a
# caller-supplied CNF and return the solver's own refutation as a validated,
# in-memory resolution DAG (clause DB + LRAT-style RUP steps with hint ids,
# terminating at the empty clause; no file round-trip). Downstream certificate
# bridges can use it to compare proofs from independently written bit-blasters.
# Zero extra dependencies; off by default to keep the
# certificate-export surface out of the core solver build.
unsat-cert = []
# Experimental: compile the len-6/8 BCP replacement-scan specialization.
# Off by default after SAT Main profiling showed a regression.

[dependencies]
ay-core.workspace = true
ay-sat-congruence-core.workspace = true
ay-drat-check.workspace = true
ay-sys.workspace = true
ay-proof-common.workspace = true
ay-prefetch.workspace = true
hashbrown.workspace = true
foldhash.workspace = true
tracing.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytemuck.workspace = true
sha2.workspace = true
smallvec.workspace = true
fixedbitset.workspace = true
serde = { workspace = true, optional = true }
ay-jit = { path = "../ay-jit", optional = true }
parking_lot.workspace = true
clap = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
criterion.workspace = true
ay-criterion-main.workspace = true
proptest.workspace = true
ntest.workspace = true
tempfile.workspace = true
wait-timeout.workspace = true
ay-lrat-check.workspace = true
ay-tla-bridge.workspace = true
ay-test-support.workspace = true

[[bench]]
name = "sat_bench"
harness = false
