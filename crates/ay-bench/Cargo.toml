[package]
name = "ay-bench"
description = "Competition-standard benchmarking CLI for AY SMT solver"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ay_bench"
path = "src/lib.rs"

[[bin]]
name = "ay-bench-resource"
path = "src/resource_worker.rs"

[dependencies]
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
rusqlite.workspace = true
rayon.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
wait-timeout.workspace = true
ay-proof-complexity.workspace = true
ay-chc.workspace = true
ay-core.workspace = true
ay-encode = { path = "../ay-encode" }
flate2 = "1.1.9"
tar.workspace = true
# On every target: the harness writes to its sidecars and targets only through
# `ay_sys::child_pipe::ChildPipeWriter`.
ay-sys.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "time", "user", "resource"] }

[dev-dependencies]
ay-test-support.workspace = true

[lints]
workspace = true
