# AY script index, consumed by `ay scripts`. Public half; internal entries live
# in scripts/index-internal.toml (never published). Every in-scope tracked
# script has exactly one entry across the two files, or matches [policy].exempt
# — `ay scripts check` enforces the bijection, fail-closed.
#
# Scope (fixed): the index covers runnable/sourceable scripts under scripts/,
# competition/, benchmarks/, deploy/, proofs/, crates/**/proofs/, plus runnable
# scripts under non-allowlisted dirs (docs/, reports/, tools/), which are
# internal by definition. Out of scope: the [policy].exempt globs below.
#
# The index is authoritative; the only in-file metadata is the one-line
# `# ay-script: <name>` header after the shebang.

schema_version = 1

[policy]
exempt = [
  "bindings/python/ayz3/**",     # library modules (ayz3_fuzz indexed once as `python -m ayz3_fuzz`)
  "bindings/python/ayz3_fuzz/**", # covered by the single ayz3-fuzz entry
  "bindings/python/tests/**",    # pytest-discovered
  "bindings/python/examples/**", # README-documented examples
  "bindings/python/conftest.py",
  "bindings/python/setup.py",    # packaging convention
  "third_party/**",              # vendored
  "publish/**",                  # publication-repo shim
]

