\* Small-constant TLC config for PDR trace mutation tests.
\* The mutation tests use a trivially-unsafe problem (depth-0 counterexample)
\* that only needs minimal bounds.  Tight bounds also provide stricter
\* TypeInvariant checking for mutation detection. Part of #2643.

CONSTANTS
    MaxFrames = 8
    MaxLemmas = 10
    MaxObligations = 5
    MaxPredicates = 4

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT FrameMonotonicity
INVARIANT ObligationLevelBound
INVARIANT LemmaMonotonicity
