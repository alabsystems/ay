# AY-21 holdout: real Trust mask-and-shift obligations, split by crate.
#
# Source: the exact programs Trust's in-process backend hands AY
# (`TRUST_AY_SMT_TRACE=1 offline deductive checker check --lib`, ~/trust at the AY-21
# capture), one standalone crate at a time, deduplicated by SHA-256 of the
# query text, keeping those whose assertions use bvand/bvor/bvxor/bvshl/
# bvlshr/bvashr/extract/concat. Crates: Trust's verified crates and
# bit-manipulation crates from crates.io, as Trust verifies them.
#
# Split (fixed before any tuning): a crate is in the holdout when the first
# 32 bits of SHA-256(crate name) are odd, else in training. Expected
# verdicts: the ci/z3.pin reference z3, 60 s, reading each query under
# (set-logic ALL) because under QF_UFBVLIA it rejects int2bv and answers
# with the assertion dropped; "unknown" when it gave no clean answer.
#
# Frozen 2026-11-20. Do not edit, extend or re-label: tune on the training split.
schema = 1
deadline_ms = 5000

