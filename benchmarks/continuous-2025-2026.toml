  "ICCMA 2025 Dynamic retains the final published averages because applying the stated 1200-second timeout and 2400-second PAR-2 penalty to the pinned 322-row CSV does not reproduce any of its eight published solver/field values. DS-PR also has an official-source conflict: the November result slides print Scallop at 229.6096, while the final Zenodo results and current rankings print 2348.9362 and rank mutoksia first at 580.9538. The CSV omits answer payloads, so neither the divergent instance nor solver fault can be established without speculation.",
