source_audit_notes = [
  "Official primary pages and artifacts were rechecked on 2026-07-23.",
  "SAT Competition 2026 published corrected final slides and a complete per-instance sequential-result CSV on 2026-07-23. The separately linked results.html table still duplicates an older event, so it is not admitted as 2026 evidence.",
  "SAT Competition 2026's published prizes apply a one-prize-per-author-per-track rule. The result CSV does not contain author membership, so the Main award views remain partial even though raw sequential performance for 29 submissions is reconstructable.",
  "SAT Competition 2026's CSV identifies Main, Main-AI, Experimental, and Experimental-AI entries, but has no Parallel/Cloud rows and does not distinguish AI-generated from AI-tuned entries. Those missing field splits remain explicit rather than inferred.",
  "PB Competition 2026's full detailed portals and machine-readable text exports became public after the earlier audit; the catalog now links those artifacts instead of describing them as login-only.",
  "MaxSAT Evaluation 2026 published final ranking tables, per-instance CSVs, and a complete Zenodo result artifact on 2026-07-23. Exact tracks are ranked by optimal instances solved; incremental solvers are ranked independently on each of five applications, while the displayed all-applications sum is not an official leaderboard.",
  "XCSP3 Competition 2025 published six proof-aware podium views in its immutable result slides. Its four no-optimality-proof rows are partial reconstructions from the current analyzer API, not separately published leaderboards; the current Parallel COP API differs slightly from the immutable slide totals, so the published proof-aware catalog values follow the slides.",
  "XCSP3 Competition 2026 published six final proof-aware podium views through rank arrays in its public JSON API. Four no-optimality-proof rows are derived alternate score views over the same raw COP runs; the API also includes off-competition and discarded same-team variants, so those derived views remain explicit about eligibility limits.",
  "The XCSP3 audit manifests under benchmarks/xcsp3 pin URL, exact byte length, and SHA-256 for all 77 XCSP25 and 100 XCSP26 solver-result responses used to reconstruct numeric scores. A malformed XCSP25 Fast COP bound and an XCSP25 Mini COP record beyond the official timeout are excluded fail-closed.",
  "XCSP3 Competition 2026's official frontend selected-corpus link returned HTTP 404 at retrieval time, so corpus readiness remains fail-closed.",
  "The QBF Gallery 2026 page had an invalid TLS certificate chain at retrieval time; automation must fail closed rather than silently disabling certificate checks.",
  "The FLoC 2026 Olympics inventory was used to add tracking-only rows for competition families outside AY's current input and proof formats.",
  "PB26's official presentation and SMT-COMP's public 2026_results branch appeared during the audit; their public summary/provisional states are recorded without treating them as complete raw final-result packets.",
  "CHC-COMP 2026 published participant-certified Solver and Model tables for nine theory categories plus Overall; all 20 default correct-count fields are normalized with complete eligible participant lists, denominators, and immutable evidence.",
  "MiniZinc Challenge 2026 published all five medal tables and detailed raw results on 2026-07-23. Medalists are normalized as partial fields while the complete Borda aggregates remain to be reconstructed from the pinned result artifact.",
  "Test-Comp 2026's three medal fields are normalized from the official eligible ranking; integer score displays and two-significant-digit successful CPU times remain partial because hidden precision affects the Overall score.",
  "SYNTCOMP 2026's five published leaderboards are normalized from the result page and first Zenodo snapshot. The archive is explicitly preliminary and the competition accepts rolling reruns, so provenance records this snapshot rather than claiming it can never change.",
  "SYNTCOMP 2025's final Zenodo result archive is content-bound and its five published leaderboard views are normalized below; disqualified configurations are excluded and equal solve counts use the official wall-clock tie-break.",
  "Model Counting Competition 2026 announced its result presentation for 2026-07-23, but no official result table, archive, or repository update was public when rechecked after that presentation; all six aggregate placeholders therefore remain explicitly pending.",
  "VNN-COMP 2025's Regular and Extended zero-tolerance overall score tables and all 25 explicit per-benchmark rank tables (16 Regular, nine Extended) are normalized from the official result repository. The benchmark tables are public result surfaces, not claims of separately conferred medals. The paper's small-tolerance sensitivity analysis remains provenance metadata rather than a duplicate set of rows.",
  "Model Counting Competition 2025's final awards presentation publishes exactly three ranking columns (A/0%, B/0.1%, C/0.8) for each of Tracks 1, 3, and 4; all nine result views are materialized. The current rules page's inconsistent C/D prose does not establish an additional published result view.",
  "PB Competition 2025's roughly 200 combinations are explicitly described as possible alternate rankings over base tracks, support subsets, complete/incomplete solvers, CPU/wall time, certificate handling, and scoring schemes; many combinations do not exist or are not useful. PB Competition 2026 explicitly identifies DEC-LIN and OPT-LIN as its two main official award rankings and calls the other portal surfaces additional rankings. Those matrices are analysis views, not additional competition tracks or awards.",
  "SMT-COMP 2025 now has one explicit row for every published result surface: 280 division/scoring tables and 57 competition-wide recognition/scoring views. Each row normalizes up to the first three published eligible entries with score and solve-rate evidence and remains field-partial; division tables are not mislabeled as medal tracks.",
  "The SMT-COMP 2025 generated pages and processed artifacts are pinned at organizer archive commit 401302678311593efcef8a79b614b33a3b853eac. Incremental rates use correct check-sats over exact selected check-sat denominators because the generated pages' Solved column is always zero; the archive's literal 30720 GB display is retained as a source defect rather than interpreted as hardware truth.",
  "SV-COMP's Table of All Results contributes 48 public base-category score views for 2025 and 55 for 2026, plus the missing 2026 SV-LIB demo aggregate. These 104 views are explicitly distinct from medal leaderboards. Each partial field records three display leaders, points, maximum points, confirmed-correct solves, valid-task solve rate, and the rounded successful-CPU-time display; nine views are labeled demo rather than silently treated as awards.",
  "The TermCOMP 2026 registration branch at commit 9465fba581c4d0a3a8cdd09a15e2e243928c1698 has at least two entries in 14 category files. Eleven previously omitted category identities are now conditional/pending. Registration does not establish the separate minimum of 40 selected examples, and no final result or winner is inferred before publication.",
  "CASC-30's eight ranked 2025 divisions are normalized as complete eligible fields from the final result summary and detailed per-problem report; unranked pink demonstration systems are excluded, including the prior SLH winner whose diagnostic count exceeds the ranked winner.",
  "CoCo 2025's five combined, ten answer-specific, CERTIFICATION, and RELIABILITY fields are normalized from the working ARI-COPS competition views, LiveView, deterministic selection archives, and the archived official award table.",
  "This is a bounded, non-exhaustive research inventory. Aggregate placeholders are deliberately not marked status = \"final\", and ranked rows represent one identifiable leaderboard view rather than every secondary award surface.",
  "Every leaderboard in the official SV-COMP verification and witness-validation rank tables, the separately published 2026 Huawei demo prize ranking, all 104 published 2025/2026 category-score surfaces, and the Test-Comp rank tables for 2025/2026 is materialized below.",
  "Test-Comp 2025 publishes its normalized scores only at integer display precision and successful CPU time rounded to two significant digits; those three fields remain partial rather than pretending the displayed values reconstruct the full ordering.",
  "The LP/CP Programming Contest 2025 repository publishes a 14-point winner and 6-point runner-up but no complete field; the stable floc-modeling catalog id is retained with an explicit branding and field caveat.",
  "ARCH-COMP 2025/2026 is represented by one final-unranked row per published category report; the official proceedings explicitly provide no ranking of tools.",
  "HWMCC 2025's four certified medal leaderboards and ICCMA 2025's 27 published normal leaderboards are materialized as complete eligible fields with typed comparators and content-bound public evidence.",
  "No official HWMCC 2026 edition page or announcement was found, and ICCMA's official home plans ICCMA 2027 after the concluded 2025 edition; no 2026 rows were invented for either family.",
  "ICCMA 2025 advertised No-Limits and Fixed-SAT-Solver comparisons, but its official solver list and final rankings publish no such leaderboards; only the 27 identifiable normal result views are rows.",
