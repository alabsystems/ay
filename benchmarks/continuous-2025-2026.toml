# Continuous 2025/2026 competition campaign manifest.
#
# This file records official event facts, evidence identities, and AY solver-side
# capability. It does not prescribe execution commands or claim that AY entered
# an event. Empty URLs are intentional and paired with an explicit pending,
# cancelled, omitted, or not-applicable status.
#
# status describes the official event/track state.
# readiness describes whether official rules, corpus, and results are complete
# enough for a reproducible retroactive campaign.
# ay_adapter_status is historical naming for solver-side capability only; even
# "ready" does not mean that a reproducible campaign packet, checker, corpus,
# or official scorer exists. Executable campaign readiness lives in
# continuous-lanes.toml and defaults to blocked.
# Values are: ready, partial, unsupported, not-applicable.
# official_score_direction is one of: minimize, maximize,
# mixed-lexicographic, none, pending.

