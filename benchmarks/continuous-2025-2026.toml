# Continuous 2025/2026 competition campaign manifest.
#
# This file records official event facts and AY solver-side capability. It does not
# prescribe execution commands, pin artifacts, or claim that AY entered an
# event. Empty URLs are intentional and paired with an explicit pending,
# cancelled, omitted, or not-applicable status.
#
# status describes the official event/track state.
# readiness describes whether official rules, corpus, and results are complete
# enough for a reproducible retroactive campaign.
# ay_adapter_status is historical naming for solver-side capability only; even
# "ready" does not mean that a reproducible campaign packet, checker, corpus,
# or official scorer exists. Executable campaign readiness lives in
# continuous-lanes.toml and defaults to blocked.
# Values are: ready, partial, unsupported, not-applicable.
# official_score_direction is one of: minimize, maximize,
# mixed-lexicographic, none, pending.

schema_version = 1
retrieved_at = "2026-07-23T07:43:59-07:00"
campaign_packet_status = "catalog-only"
scope = "bounded-non-exhaustive"
source_audit_notes = [
  "Official primary pages and artifacts were rechecked on 2026-07-23.",
  "The SAT Competition 2026 results page was not treated as current evidence because it still duplicated the 2024 results page at retrieval time.",
  "The QBF Gallery 2026 page had an invalid TLS certificate chain at retrieval time; automation must fail closed rather than silently disabling certificate checks.",
  "The FLoC 2026 Olympics inventory was used to add tracking-only rows for competition families outside AY's current input and proof formats.",
  "PB26's official presentation and SMT-COMP's public 2026_results branch appeared during the audit; their public summary/provisional states are recorded without treating them as complete raw final-result packets.",
  "CoCo 2025's official main page links its final results, but the direct results.php endpoint returned HTTP 500 to an uncached retrieval; automation must retry without downgrading the event from final.",
  "This is a bounded, non-exhaustive research inventory. Aggregate placeholders are deliberately not marked status = \"final\", and ranked rows represent one identifiable leaderboard view rather than every secondary award surface.",
  "Every leaderboard in the official SV-COMP verification and witness-validation rank tables, the separately published 2026 Huawei demo prize ranking, and the Test-Comp rank tables for 2025/2026 is materialized below; ARCH-COMP 2025/2026 remains a known unranked-event inventory gap.",
  "HWMCC 2025's four certified medal leaderboards and ICCMA 2025's 27 published normal leaderboards are materialized below with official winner targets and public artifacts.",
  "No official HWMCC 2026 edition page or announcement was found, and ICCMA's official home plans ICCMA 2027 after the concluded 2025 edition; no 2026 rows were invented for either family.",
  "ICCMA 2025 advertised No-Limits and Fixed-SAT-Solver comparisons, but its official solver list and final rankings publish no such leaderboards; only the 27 identifiable normal result views are rows.",
  "ICCMA 2025's correctness and I/O rules are at https://www.argumentationcompetition.org/2025/rules.html and its official raw-result archive is https://doi.org/10.5281/zenodo.18506390.",
