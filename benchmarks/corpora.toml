# AY benchmark corpora manifest, consumed by `ay corpus`.
#
# Each entry's `source` selects the fetch strategy:
#   - release: tarball uploaded as a GitHub release asset on `repo`/`release_tag`.
#               Requires `asset` and `sha256`. Supports `ay corpus upload`.
#   - http:    archive fetched from a fixed URL. `archive` is "tar" (default),
#              "zip", or "none". `sha256` is optional but recommended.
#   - git:     shallow fetch from `url` at optional exact `commit`. Set
#              `requires_git_lfs = true` only when the pinned tree has actual
#              Git LFS pointer blobs (attributes alone do not count).
#   - gbd:     per-file fetch from the Global Benchmark Database. `manifest`
#              names a CSV with `hash` and `local_path` columns. Campaign
#              manifests also pin every response with `size_bytes` and
#              `sha256`; those files remain compressed for private run-time
#              decompression. Legacy unpinned fixtures retain plain siblings.
#   - uri-list: fetch every HTTPS URL in a separately downloaded, pinned
#               manifest into `extract_to`. Campaign rows carry exact response
#               sizes/SHA-256 values and remain compressed; legacy unpinned
#               lists may retain their historical decompressed siblings.
#
# `extract_to` is the destination directory (or, for archive="none", the
# destination file path). By default an archive must have exactly one root with
# the same basename as `extract_to`. For multi-root HTTP archives,
# `wrap_archive = true` extracts every root inside that exact directory and
# installs/prunes it as one owned tree.
# `ay corpus check-urls` validates every entry.

schema_version = 2
repo = "alabsystems/ay"
release_tag = "corpora-v1"

[[corpus]]
# SAT-COMP 2024 sample CNFs, keyed by content hash via the Global Benchmark
# Database (https://benchmark-database.de/file/<hash>). Each manifest row is
# downloaded and xz-decompressed into its `local_path`. This replaces the old
# GitHub release asset below, which is currently "Not Found".
#
# Fallback (release source, asset no longer published):
#   source = "release"
#   asset = "satcomp2024-sample-v1.tar.zst"
#   sha256 = "038a57918890e40e6f2a808b938bfbc51c2e120ef6d11d92cf46dd551b5ef7b8"
#   size_bytes = 59867702
name = "satcomp2024-sample"
source = "gbd"
extract_to = "benchmarks/sat/satcomp2024-sample"
manifest = "benchmarks/sat/satcomp2024-sample/manifest.csv"

