[[corpus]]
# CHC-COMP-normalised "_000" instances used as the ay-chc unit-test fixtures
# (include_str! at compile time). Only the `extra-small-lia/*_000.smt2` subset
# of this repo is the test corpus; those files are VENDORED (committed) under
# benchmarks/chc-comp/2025/extra-small-lia/*_000.smt2. This entry exists to
# refresh them from upstream; clone here, then copy the desired *_000.smt2 over.
# (Two fixtures are AY-specific and NOT upstream: accumulator_unsafe_000 and
# two_phase_unsafe_000.)
name = "chc-comp-2025-extra-small-lia-fixtures"
source = "git"
extract_to = "benchmarks/chc/chc-comp25-benchmarks-fixtures"
url = "https://github.com/chc-comp/chc-comp25-benchmarks"
commit = "ddd279cab0717db6effe69baad451a8eb04ffd86"

[[corpus]]
# Full CHC-COMP 2025 benchmark set (~1.2 GB) with the LIA-Lin.set manifest
# backing the chccomp-2025-lia-lin eval. Large; fetch only when running the
# full CHC replacement-surface comparison.
name = "chc-comp-2025-benchmarks"
source = "git"
extract_to = "benchmarks/chc/chc-comp25-benchmarks"
url = "https://github.com/chc-comp/chc-comp25-benchmarks"
commit = "ddd279cab0717db6effe69baad451a8eb04ffd86"

[[corpus]]
# CreuSAT's vendored SAT-2009-preprocessed (mfleury) benchmark set, the source of
# the reference/creusat/tests/mfleury/** CNFs the ay-sat soundness / DRAT /
# differential tests resolve (een-tip, hsat_vc, xinetd_vc, cmu-bmc, manol-pipe,
# AProVE, ...). Cloned into the gitignored reference/ tree. `ay corpus` does a
# full clone; for just the benchmarks a sparse checkout of tests/mfleury suffices.
name = "creusat-mfleury"
source = "git"
extract_to = "reference/creusat"
url = "https://github.com/sarsko/CreuSAT"

[[corpus]]
# MaxSAT Evaluation 2024 exact-track unweighted instances (553 .wcnf.xz;
# ~2.0 GB archive). The per-instance reference results (all 2024 exact-track
# solvers + known optima) live in benchmarks/maxsat/mse24/*.csv, which
# `ay maxsat bench` uses for verification and retroactive leaderboards.
# Decompress after fetch: find <dir> -name '*.xz' -exec xz -dk {} +
name = "mse24-exact-unweighted"
source = "http"
extract_to = "benchmarks/maxsat/mse24-exact-unweighted"
url = "https://www.cs.helsinki.fi/group/coreo/MSE2024-instances/mse24-exact-unweighted.zip"
archive = "zip"

[[corpus]]
