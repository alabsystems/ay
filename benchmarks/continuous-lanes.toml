# Competition-time lanes are deliberately separate from the four-hour proxy
# rotation.  Enable them explicitly after the exact corpus and checker packet
# are frozen; different timeout/proof/resource envelopes are not comparable.
[[lane]]
id = "satcomp-2025-main-official"
kind = "official"
eval_id = "sat-satcomp-2025-main-corpus"
runs = 1
official = true
enabled = false
requires_paths = [
  "benchmarks/sat/satcomp2025-main/SC2025.uri",
  "benchmarks/sat/satcomp2025-main/instances",
]
blocked_reason = "The exact corpus is mapped, but official hardware, checker, timeout, and submitted-tool replay gates remain unsatisfied."
competition_refs = ["satcomp-2025-main"]

[[lane]]
id = "chccomp-2025-lia-lin-official"
kind = "official"
eval_id = "chccomp-2025-lia-lin"
runs = 1
official = true
enabled = false
requires_paths = [
  "benchmarks/chc/chc-comp25-benchmarks/LIA-Lin.set",
]
blocked_reason = "Enable only with the full pinned corpus and checker/reference packet."
competition_refs = ["chccomp-2025-lia-lin"]

# Fixed shard-0 competition-mode evidence for the nonlinear LIA+arrays focus.
# `official = true` selects AY's canonical 1800s CHC-COMP child contract; this
# lane deliberately has no timeout_sec override. The trusted native runner
# persists its oom-guard resource plan and enforcement tag with every result.
# The 12,000s command cap protects the 4h controller and can abort this lane
# incomplete; it is not a claim that 64 sequential AY+Z3 official-time runs
# fit inside one cycle. This lane is selected only by `cycle --official`.
[[lane]]
id = "chccomp-2025-lia-nonlin-arrays-official-shard-0"
kind = "official"
eval_id = "chccomp-2025-lia-nonlin-arrays"
runs = 1
official = true
enabled = true
shard_index = 0
shard_size = 64
command_timeout_sec = 12000
min_benchmarks = 1738
requires_tools = ["z3"]
requires_paths = [
  "benchmarks/chc/chc-comp25-benchmarks/LIA-Arrays.set",
]
competition_refs = ["chccomp-2025-lia-nonlin-arrays"]
