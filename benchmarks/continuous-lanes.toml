# Competition-time lanes are deliberately separate from the four-hour proxy
# rotation.  Enable them explicitly after the exact corpus and checker packet
# are frozen; different timeout/proof/resource envelopes are not comparable.
[[lane]]
id = "satcomp-2025-main-official"
kind = "official"
eval_id = "sat-par2-heldout"
runs = 1
official = true
enabled = false
requires_paths = [
  "benchmarks/sat/par2/heldout.txt",
  "benchmarks/sat/par2/heldout",
]
blocked_reason = "Exact 400-instance SAT-COMP 2025 packet is not mapped to this eval yet."
competition_refs = ["satcomp-2025-main"]

