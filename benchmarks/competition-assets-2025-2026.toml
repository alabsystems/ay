# Fail-closed acquisition and execution coverage for the 2025/2026 campaign.
#
# `corpus_status = "complete-public"` means only that the selected official
# inputs are represented by pinned entries in `corpora_manifest`. Downloaded
# assets are not, by themselves, an executable official replay: a format
# adapter, checker/scorer, limits, and competitor packages are separate gates.
#
# No run on the current host is an official-hardware-equivalent result. An
# envelope-fitting run is "same-host calibrated" only after the same pinned
# limits and machine controls are used for AY and the pinned competitors.
# Underpowered runs and deterministic subsets are directional evidence and
# must never be promoted to retroactive official scores.

schema_version = 1
catalog = "benchmarks/continuous-2025-2026.toml"
corpora_manifest = "benchmarks/corpora.toml"
profiles_manifest = "benchmarks/competition-run-profiles.toml"
scope = "exactly-one-event-per-catalog-competition-edition-pair"

