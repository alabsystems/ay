# benchmarks/comparisons.toml — the benchmark-comparison registry, consumed by
# `ay bench compare` (design: the development design notes §3.1; run
# classes: official / replay / laptop — see the development design notes).
#
# Every fact below was researched from the official competition sites through
# 2026-07-24 with citations; "unknown" means the official record did not state
# it — never a guess. Entries are data for `ay bench compare`; nothing here is
# an AY result claim.
#
# 0.1.0 schema (validated by `ay bench compare`):
#   id             unique kebab-case <competition>-<edition>[-<track-slug>]
#   competition    closed set: satcomp | smtcomp | chccomp | qbfeval | pbcomp |
#                  maxsat | mznc | hwmcc | mcc | miplib
#   edition        integer year (original edition labels preserved in `notes`)
#   track          the researched track/division label, verbatim
#   status         specs-pending | ready | archived. `ready` = official specs
#                  cited and parsed; entries without cited specs ("unknown" or
#                  "n/a" hosts) are specs-pending and refuse the post-0.1.0
#                  `run --class replay` / `refs --install`.
#   official_hosts / budgets / scoring / corpus / winners / citations
#                  the research wave's cited facts, VERBATIM prose
#   corpus_name    benchmarks/corpora.toml entry name when the corpus is
#                  locally managed; absent/"" = external
#   [comparison.official]
#                  host fields parsed from the official_hosts prose, used by
#                  `compare check` for the replay-eligible / laptop-only
#                  verdict. cores/memory_gb are the cited per-node (or, where
#                  only that is cited, per-job-config) values; 0/"" = not
#                  stated. arch is derived from the cited CPU model
#                  (Intel/AMD => x86_64). memory tolerance defaults to 10%.
#
# competition slugs: satcomp = SAT Competition; smtcomp = SMT-COMP;
#   chccomp = CHC-COMP; qbfeval = QBF Gallery (successor event line of
#   QBFEVAL); pbcomp = Pseudo-Boolean Competition; maxsat = MaxSAT Evaluation;
#   mcc = Model Counting Competition; mznc = MiniZinc Challenge;
#   miplib = MIPLIB (benchmark set, NOT a competition); hwmcc = HWMCC
#   (no entries yet).
#
# Reference solvers pinned constellation-wide:
#   z3-4.15.4  (the recorded differential-study reference)
#   z3-5.0.0   (latest release, 2026-07-17, official arm64-osx binary)

schema_version = 1


