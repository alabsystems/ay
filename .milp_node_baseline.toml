# EXACT node-count pins for the deterministic MILP corpus. Written by
# `scripts/milp_node_gate.py --ratchet`, checked by `--check`, and validated for
# shape/completeness by `crates/ay-milp/tests/node_ratchet.rs` in the default
# test run.
#
# A CHANGE THAT MOVES ANY NUMBER BELOW MUST UPDATE IT DELIBERATELY, in the same
# commit, with the measurement in the message. That includes IMPROVEMENTS: an
# unratcheted improvement is how a pin rots into folklore, and it is also how a
# later regression gets to hide inside slack that nobody meant to grant.
#
# `nodes` is the load-invariant currency and the primary tripwire; `obj` and
# `status` are correctness pins that are never downgraded to warnings. `wall_s`
# is RECORDED, not gated -- a busy box moves it and the gate must not care.
#
# tier = "fast"  -- the pre-merge lane (`--tier fast`)
# tier = "slow"  -- pre-push / nightly only (`--tier all`)
#
# QUIET BOX ONLY. The pins here are quiet-box values, reproduced three times
# each (blend2 = 9,070, mod010 = 2,381), and confirmed independently by a
# second measurer.
#
# The load precondition exists because "node counts are load-invariant" is only
# APPROXIMATELY true: instances whose root cut loop bounds its round count by a
# SHARE of the wall deadline can buy fewer rounds under contention and grow a
# slightly different tree. One observation of that was recorded while building
# this gate (blend2 8,995 and mod010 2,291 during a concurrent `cargo test` at
# load average 43 on 14 cores) — but an independent auditor could NOT reproduce
# it, so treat the mechanism as plausible and the specific numbers as
# unconfirmed. The precondition is cheap insurance either way: a phantom FAIL is
# how a gate gets muted, and the gate exits 2 (SETUP, neither pass nor fail)
# above 0.35 x cpu_count rather than reporting a verdict it cannot stand behind.
# IF YOU EVER SEE 8,995 HERE, THE FIX IS TO RE-RUN ON AN IDLE BOX -- not to
# ratchet the loaded number in.
#
# qiu WAS EXCLUDED AS FLAKY AND IS NOW PINNED (2026-08-26). The old [flaky] entry
# read "moves run-to-run at fixed configuration"; that was measured on an OLDER
# engine, where qiu drifted 3,946..4,121 across six runs, and 6715ed282 later took
# it 4,121 -> 2,831. Re-measured at the CURRENT shipped default before pinning:
#
#     29 solves attempted, 28 completed, 28/28 at nodes = 2,831,
#     obj = -132.873136947, status = OPTIMAL, and the same GMICUTS separation
#     digest (n=16, fc7d711a3895b1ff) every time. The 29th was killed by an
#     external SIGTERM (rc 143) and is recorded as KILLED, not as a datum.
#     Spanning 1-minute load 2.5 .. 19.7 on 14 cpus (wall 33.4 .. 54.8 s), and
#     spanning --limit 60 / 120 / 300 interleaved, so the tree is NOT
#     deadline-coupled the way blend2 and mod010 are. `corpus_guard.py`'s own
#     independently-captured baseline also reads 2,831.
#
# THE CORROBORATION, stated in the one currency that is comparable:
# `reports/corpus-baseline.json` has read qiu at 2,831 nodes since e5182aaae --
# the SAME lane and the SAME quantity this file pins, captured independently.
# That is what makes the old "moves run-to-run" entry stale.
#
# DO NOT cite `.milp_rim_baseline.toml` as a second opinion here, and an earlier
# draft of this comment did exactly that. It pins qiu's EXACT-RIM walk
# (p1_pivots = 2799, pivots = 9189, an exact rational optimum) -- a different
# lane measuring a different quantity, entered about once per 1.36M nodes. A
# gate that never had an opinion about tree node counts cannot have disagreed
# about them. Two instruments measuring different things are not a
# contradiction, and reading them as one is the error this campaign keeps
# paying for.
#
# WHY IT IS WORTH THE 35 s IT ADDS TO `--tier all`. qiu is the ONLY one of the 30
# canonical instances whose shape (m >= 1,000 and n < m -- qiu is 1,192 x 840)
# arms `FloatLp::tall_cold_dual`, the warm-failure cold-dual disjunct at
# simplex.rs's `(lp.wide_tall() || lp.tall_cold_dual() || cold_dual_all())`. With
# qiu excluded, this ratchet reported `0 fail` at --tier all against a build with
# that disjunct disarmed -- measured, both arms, quiet box: 19 instances, 42.0 s
# clean against 42.7 s clean. It is now the gate that sees it: with qiu pinned,
# the same disarmed build reports
#     FAIL qiu NODES expected 2831 actual 6506 (2.30x, REGRESSION)
#
# NOTE THE ASYMMETRY, because it is the whole justification for reversing the
# exclusion. Interleaved A,B,A,B on ONE binary, quiet box: the shipped default
# gave 2,831 four times out of four; `--no-tall-cold-dual` gave 6,511 / 6,499 /
# 6,504 -- three distinct values in three runs. One GMI digest per arm (default
# n=16 fc7d711a3895b1ff, disarmed n=8 ade56e208aa70f2c), so the drift is
# DOWNSTREAM of separation. Across all seven disarmed runs taken: five distinct
# values in 6,499..6,529, against ONE value in twenty-eight default runs. The
# INSTANCE is not flaky; the DISARMED configuration is.

