# Andrew Yates <andrewyates.name@gmail.com>
# Eval spec for CHC-COMP 2025 LIA-Lin benchmark suite
id: chccomp-2025-lia-lin
version: 1
description: CHC-COMP 2025 official LIA-Lin benchmark suite via set manifest
owner: andrewyates.name@gmail.com
inputs:
  benchmarks_dir: benchmarks/chc/chc-comp25-benchmarks
  set_file: LIA-Lin.set
  timeout_sec: 30
  runs: 3
  reference_solver: z3
metrics:
  - passed
  - total
  - sat
  - unsat
  - wrong
  - timeout
  - unknown
  - error
outputs:
  results_dir: evals/results/chccomp-2025-lia-lin/{run_id}
