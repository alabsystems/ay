id: sat-satcomp-2025-main-corpus
version: 1
description: >
  Complete 400-instance SAT Competition 2025 Main benchmark selection fetched
  from the organizer-published, pinned SC2025 URI inventory. AY and Z3 run on
  the same private input snapshots; this is a same-host corpus replay, not an
  official-hardware score.
owner: andrewyates.name@gmail.com
competition: sat-comp
scoring: sat-comp
inputs:
  benchmarks_dir: benchmarks/sat/satcomp2025-main/instances
  reference_solver: z3
  timeout_sec: 60
  standard_timeout_sec: 5000
  runs: 1
metrics:
  - solved
  - total
  - wrong
  - par2_avg
outputs:
  results_dir: evals/results/sat-satcomp-2025-main-corpus/{run_id}
