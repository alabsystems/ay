# Andrew Yates <andrewyates.name@gmail.com>
# Eval spec for the CHC-COMP 2026 solver BV-Nonlin benchmark suite
id: chccomp-2026-solver-bv-nonlin
version: 1
description: CHC-COMP 2026 official solver BV-Nonlin benchmark suite
owner: andrewyates.name@gmail.com
inputs:
  benchmarks_dir: benchmarks/chc/chc-comp26-benchmarks
  set_file: BV.set
  timeout_sec: 30
  runs: 3
  reference_solver: z3
metrics:
  - passed
  - total
  - sat
  - unsat
  - wrong
  - timeout
  - unknown
  - error
outputs:
  results_dir: evals/results/chccomp-2026-solver-bv-nonlin/{run_id}
