# Andrew Yates <andrewyates.name@gmail.com>
# Eval spec for the published SMT-COMP 2025 QF_UF selection
id: smt-smtcomp-qf-uf
version: 2
description: >
  Every QF_UF benchmark in the published SMT-COMP 2025 single-query selection
  archive (Zenodo record 16887742). This is a potentially long full-selection
  AY-vs-Z3 run.
owner: andrewyates.name@gmail.com
inputs:
  benchmarks_dir: benchmarks/smtcomp/2025/single-query/single_query/QF_UF
  reference_solver: z3
  timeout_sec: 30
  runs: 1
metrics:
  - passed
  - total
  - wrong
  - mismatch
  - timeout
  - ay_time_sec
  - z3_time_sec
  - ratio
outputs:
  results_dir: evals/results/smt-smtcomp-qf-uf/{run_id}
setup:
  download: ay corpus download smtcomp-2025-single-query
  note: >
    Download the pinned SMT-COMP 2025 single-query archive, then run all QF_UF
    instances selected by the organizers. Record the exact corpus inventory,
    binary provenance, timeout, and enforced resource envelope with any results
    you cite.
