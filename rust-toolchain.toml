# Development uses ALab's sealed Trust toolchain.
# .cargo/config.toml requires certify policy, level 2, unix_hardened,
# strict frontend lowering and authenticated dependency MIR for host/target
# compiler units, with rustdoc verification required as well. No build-script
# or dependency exemptions are part of the default route.
# Required configuration is not evidence that the complete build passes.
#
# Public snapshots keep this pin (a public user installs aterm, and atpkg
# installs Trust); publish/transforms.sh (T3) requires the `channel` line below
# to stay exactly as written.
[toolchain]
channel = "trust"
