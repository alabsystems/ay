[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/ay",
    "crates/ay-core",
    "crates/ay-param",
    "crates/ay-sat",
    "crates/ay-sat-congruence-core",
    "crates/ay-qbf",
    "crates/ay-maxsat",
    "crates/ay-allsat",
    "crates/ay-count",
    "crates/ay-proof-complexity",
    "crates/ay-dpll",
    "crates/ay-frontend",
    "crates/ay-proof",
    "crates/ay-tla-bridge",
    "crates/ay-lean-bridge",
    "crates/ay-chc",
    "crates/ay-encode",
    "crates/ay-dispatch",
    "crates/ay-ffi",
    "crates/ay-theories/euf",
    "crates/ay-theories/lra",
    "crates/ay-theories/lia",
    "crates/ay-theories/bv",
    "crates/ay-theories/arrays",
    "crates/ay-theories/strings",
    "crates/ay-theories/seq",
    "crates/ay-theories/set",
    "crates/ay-theories/multiset",
    "crates/ay-theories/map",
    "crates/ay-theories/fp",
    "crates/ay-theories/dt",
    "crates/ay-theories/nia",
    "crates/ay-theories/nra",
    "crates/ay-nra-oracle",
    "crates/ay-theories/nonlinear-common",
    "crates/ay-theories/intsat",
    "crates/ay-theories/diff-logic",
    "crates/ay-xor",
    "crates/ay-translate",
    "crates/ay-bindings",
    "crates/ay-drat-check",
    "crates/ay-lrat-check",
    "crates/ay-proof-common",
    "crates/ay-flatzinc-parser",
    "crates/ay-flatzinc-smt",
    "crates/ay-fzn2smt",
    "crates/ay-cp",
    "crates/ay-search",
    "crates/ay-sys",
    "crates/ay-prefetch",
    "crates/ay-jit",
    "crates/ay-replay",
    "crates/ay-bench",
    "crates/ay-bisect",
    "crates/ay-pb-core",
    "crates/ay-pb",
    "crates/ay-lp",
    "crates/ay-milp",
