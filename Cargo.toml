ay-dpll = { version = "0.23.0", path = "crates/ay-dpll", default-features = false, features = ["proof-checker", "jit"] }
ay-frontend = { version = "0.23.0", path = "crates/ay-frontend" }
ay-proof = { version = "0.23.0", path = "crates/ay-proof" }
ay-tla-bridge = { version = "0.23.0", path = "crates/ay-tla-bridge" }
