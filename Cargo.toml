# CLI
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# External deps for flatzinc crates
anyhow = "1"
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["process", "signal", "term"] }
signal-hook = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
lto = "thin"
# codegen-units set in .cargo/config.toml (16 for build memory; 1 here is dead config)
# `unwind` (not `abort`): the portfolio wraps every engine in `catch_unwind`
# (portfolio/schedule.rs) so one engine's panic is CONTAINED (that engine is
# discarded, the rest keep solving) rather than aborting the whole process and
# losing the instance. `panic = "abort"` silently defeated that containment —
# observed as SIGABRT crashes via e.g. ay_dpll::executor::theories::lra::solve_lra
# during competition-load runs (#18). Soundness is unaffected: a caught panic
# yields no verdict for that engine (treated as Unknown), never a wrong answer.
panic = "unwind"
# Overflow checks stay ON in release: AY must never SILENTLY wrap integer
# arithmetic — a silently-wrapped bound/objective is a soundness hazard. Where
# wrapping or saturation is genuinely intended, the code says so explicitly with
# `wrapping_*` / `saturating_*` / `checked_*`. (Re-enabled per owner directive;
# the prior `= false` was masking real i128 overflow bugs in the PB engine.)
overflow-checks = true

[profile.dev]
# Keep public debug/test builds fast enough for solver-heavy gates even when
# .cargo/config.toml is absent from sanitized publication staging.
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

# Incremental compilation is pathological on the giant lib-test units: on
# Windows (rustc 1.96.1, AMD 8700G/31GB), a warm incremental rebuild of
# ay-sat's lib-test after a one-line edit took 9,337s wall / 21.7GB rustc RSS
# — almost entirely a single-threaded phase — while the same rebuild with
# incremental off took 366s / 6.7GB (25x). The plain lib unit rebuilds
# incrementally in ~65s, so the blowup is specific to the *-test units
# (lib + inline test modules + ~3k #[test] registrations). Scoping the
# opt-out to profile.test keeps dev-profile lib rebuilds incremental.
# Measured 2026-07-14.
[profile.test]
incremental = false

# Compile third-party deps at opt-level=2 even in debug builds.
# Deps rarely change so they're compiled once and cached. Cuts debug binary sizes
# and improves test performance for hot-loop-heavy crates (hashbrown, num-bigint).
[profile.dev.package."*"]
opt-level = 2
# Disable debug info for third-party deps to cut rlib sizes ~50%.
# ay-chc's 149 MB rlib and ay-dpll's 127 MB rlib are worst offenders.
# Reduces disk I/O and linker RSS during test binary linking.
debug = false

[profile.release-perf]
inherits = "release"
lto = "fat"
codegen-units = 1
# Overflow checks ON even in the max-perf profile (see [profile.release]).
overflow-checks = true

[profile.bench]
lto = "thin"

[workspace.metadata.atpkg]
# The user-facing commands for `ay`. The flagship `ay` bin is gated behind the `cli` feature,
# so build-args enables it; a plain release build would otherwise omit it.
expose = ["ay", "ay-maxsat", "ay-pb", "ay-qbf", "ay-lrat-check"]
build-args = ["--workspace", "--features", "ay/cli"]
