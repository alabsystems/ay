ay-fp = { version = "0.23.0", path = "crates/ay-theories/fp" }
ay-dt = { version = "0.23.0", path = "crates/ay-theories/dt" }
ay-nia = { version = "0.23.0", path = "crates/ay-theories/nia" }
ay-nra = { version = "0.23.0", path = "crates/ay-theories/nra" }
ay-nonlinear-common = { version = "0.23.0", path = "crates/ay-theories/nonlinear-common" }
ay-intsat = { version = "0.23.0", path = "crates/ay-theories/intsat" }
ay-diff-logic = { version = "0.23.0", path = "crates/ay-theories/diff-logic" }
ay-chc = { version = "0.23.0", path = "crates/ay-chc" }
