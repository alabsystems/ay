ay-proof-common = { version = "0.23.0", path = "crates/ay-proof-common" }
ay-flatzinc-parser = { version = "0.23.0", path = "crates/ay-flatzinc-parser" }
ay-flatzinc-smt = { version = "0.23.0", path = "crates/ay-flatzinc-smt" }
ay-fzn2smt = { version = "0.23.0", path = "crates/ay-fzn2smt" }
ay-cp = { version = "0.23.0", path = "crates/ay-cp" }
ay-search = { version = "0.23.0", path = "crates/ay-search" }
ay-sys = { version = "0.23.0", path = "crates/ay-sys" }
ay-bench = { version = "0.23.0", path = "crates/ay-bench" }
