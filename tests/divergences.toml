# ay-dpll divergence ledger — owned, EXPIRING quarantine rows.
#
# Modelled on Trust's tests/trust-comprehensive/divergences.toml.
#
# A row here documents a test that is known-red and states WHY it is not fixed
# now, WHO owns it, and WHEN the exemption dies. A row does not make the suite
# green: the tests still run and still fail. This file is the audit trail that
# distinguishes "known, owned, and dated" from "nobody noticed".
#
# THE RULES THIS FILE IS BOUND BY
#
#   1. NEVER quarantine a soundness defect. A test that asserts a fail-closed
#      obligation and observes a published `sat`, or any test whose failure is
#      AY's own `[AY SOUNDNESS GATE] caught an INVALID model` banner, may not
#      appear here at any expiry. Those stay visibly red until fixed.
#      Four such rows are red as of 2026-08-13 and are deliberately ABSENT
#      from this file — they are listed under "EXPLICITLY NOT QUARANTINED"
#      below so their omission is auditable rather than accidental.
#   2. Quarantine is the LAST resort, not a triage convenience. The 132 red
#      rows in ay-dpll at this commit are overwhelmingly REAL DEFECTS with
#      identified mechanisms; they are recorded in
#      the development design notes and left red on purpose.
#      Only 9 rows are quarantined here.
#   3. Never weaken an assertion, loosen a bound, or delete a test to retire a
#      row from this file. Fix the defect, or let the row expire and be
#      re-reviewed.
#
# EXPLICITLY NOT QUARANTINED — soundness defects, red and staying visible:
#   executor_tests::quantifier::unknown_and_misc::
#       test_bv_uf_definition_axiom_ground_counterexample_fails_closed
#   auflia_verification_consumer_9185_reducers::
#       seq_concat_len_and_bucket_ix_definitions_are_soundly_unknown_without_joint_model
#   api::tests::test_native_replay::
#       native_replay_verification_consumer_hashmap_get_restore_bridge_fails_closed
#   auflia_verification_consumer_ext_eq_7956::
#       test_quantifier_consumer_ext_eq_tseitin_fails_closed_without_total_model_7956

